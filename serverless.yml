# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: myfuturestartup
service: income-expense-tracker

# frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: dev
  timeout: 15

  httpApi:
    cors:
      allowedOrigins:
        - https://www.income-expense-tracker.vedantlab.com
        - http://localhost:4200
      allowedMethods:
        - GET
        - POST
        - DELETE
        - PUT
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
  
  environment:
    JWT_SECRET: ${env:JWT_SECRET}
    MONGO_URI: ${env:MONGO_URI}

functions:
  api:
    handler: lambda.handler
    events:
      - httpApi: "*"

plugins: []
